<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166758">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="hero"><div class="wrap"><p class="eyebrow">REPAIR DESK · 報修服務</p><h1>讓問題被看見，<br>讓修復開始。</h1><p>填寫問題與發生地點，留下清楚的報修紀錄。</p></div></header>
  <main class="wrap">
    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading"><span class="step">01</span><div><h2 id="form-title">新增報修</h2><p>所有欄位皆必填；登記時間由系統自動產生。</p></div></div>
      <form id="repair-form">
        <fieldset id="form-fields">
          <div class="grid">
            <label>報修人<input name="reporter_name" required maxlength="100" autocomplete="name" placeholder="請輸入姓名"></label>
            <label>地點或部門<input name="location" required maxlength="200" placeholder="例如：三樓會議室"></label>
            <label>類別<select name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
          </div>
          <label class="description">問題說明<textarea name="description" required maxlength="5000" rows="5" placeholder="請描述發生的問題、時間，以及目前的狀況。"></textarea></label>
          <div class="form-bottom"><p>請勿填寫密碼或其他敏感資訊。</p><button id="submit-button" type="submit">送出報修 <span aria-hidden="true">↗</span></button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
    </section>
    <section class="records" aria-labelledby="list-title">
      <div class="section-heading list-heading"><span class="step">02</span><div><h2 id="list-title">最近報修</h2><p>顯示最近 20 筆，最新登記在最上方。</p></div><button id="refresh-button" class="secondary" type="button">重新整理</button></div>
      <p id="list-message" class="message" role="status" aria-live="polite">正在載入報修紀錄…</p>
      <div id="request-list" aria-busy="true"></div>
    </section>
  </main>
  <footer class="wrap">報修登記 · 把每一個問題，好好記下來。</footer>
</body>
</html>
